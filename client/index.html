<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#4A6741" />
    <title>一方生活 — 預約服務</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // 保留進入 LIFF 之前的原始 URL，供 BookingPublic 解析 liff.state / liff.referrer
      window.__INITIAL_URL__ = window.location.href;
      // P17 debug: ?debug=1 啟用 vConsole（手機端可看 console.log），方便 LIFF / LINE App 內部 debug
      if (/[?&]debug=1(\b|&|$)/.test(window.location.search)) {
        var __s = document.createElement('script');
        __s.src = 'https://unpkg.com/vconsole@latest/dist/vconsole.min.js';
        __s.onload = function () { try { new window.VConsole(); } catch (e) {} };
        document.head.appendChild(__s);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
